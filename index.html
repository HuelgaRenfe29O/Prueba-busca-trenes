<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renfe - Consulta de Trenes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#640554;
    padding:20px;
}

.cabecera{
    max-width:1200px;
    margin:0 auto 25px;
    background:linear-gradient(
        90deg,
        #7a0a60 0%,
        #9b0f67 25%,
        #c00060 55%,
        #e10068 80%,
        #ff4a93 100%
    );
    border-radius:20px;
    padding:20px 30px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.titulo h1{
    color:white;
    font-size:56px;
    line-height:1;
}

.titulo h2{
    color:white;
    font-size:24px;
    font-weight:300;
    margin-top:5px;
}

.card{
    max-width:1200px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.20);
}

.buscador{
    background:linear-gradient(
        90deg,
        #7a0a60 0%,
        #9b0f67 25%,
        #c00060 55%,
        #e10068 80%,
        #ff4a93 100%
    );
    border-radius:15px;
    padding:25px;
    margin-bottom:25px;
}

.buscador h3{
    color:white;
    text-align:center;
    margin-bottom:15px;
    font-size:28px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
}

#resultado{
    margin-top:20px;
}

.ficha{
    border-radius:15px;
    background:#f8f8f8;
    padding:25px;
}

.campo{
    margin-bottom:12px;
    font-size:18px;
}

.estado{
    margin-top:25px;
    text-align:center;
    font-size:34px;
    font-weight:700;
    color:white;
    padding:20px;
    border-radius:12px;
}

.verde{
    background:#16a34a;
}

.rojo{
    background:#dc2626;
}

.obs{
    margin-top:20px;
    background:white;
    border-left:5px solid #c00060;
    padding:15px;
    border-radius:10px;
}

footer{
    text-align:center;
    color:white;
    margin-top:20px;
    font-size:13px;
}

@media(max-width:768px){

    .titulo h1{
        font-size:38px;
    }

    .titulo h2{
        font-size:18px;
    }

    .card{
        padding:20px;
    }
}

</style>
</head>

<body>

<header class="cabecera">
    <div class="titulo">
        <h1>RENFE</h1>
        <h2>Consulta de Trenes</h2>
    </div>
</header>

<div class="card">

    <div class="buscador">

        <h3>Consulta por número de tren</h3>

        <input
            type="text"
            id="tren"
            placeholder="Introduzca número de tren">

    </div>

    <div id="resultado"></div>

</div>

<footer>
Renfe · Consulta de afectaciones
</footer>

<script>

let trenes=[];

fetch("datos.csv")
.then(response => response.text())
.then(texto => {

    const lineas = texto.split(/\r?\n/);

    for(let i=1;i<lineas.length;i++){

        if(!lineas[i].trim()) continue;

        const c = lineas[i].split(";");

        trenes.push({
            dia:c[0]||"",
            tren:c[1]||"",
            salida:c[2]||"",
            llegada:c[3]||"",
            recorrido:c[4]||"",
            origen:c[5]||"",
            destino:c[6]||"",
            afectacion:c[7]||"",
            observaciones:c[8]||""
        });
    }
});

document.getElementById("tren").addEventListener("input",buscar);

function buscar(){

    const numero =
        document.getElementById("tren").value.trim();

    const resultado =
        document.getElementById("resultado");

    if(numero===""){
        resultado.innerHTML="";
        return;
    }

    const dato =
        trenes.find(t => t.tren.trim() === numero);

    if(!dato){
        resultado.innerHTML=
            "<div class='ficha'>Tren no encontrado.</div>";
        return;
    }

    const circula =
        dato.afectacion.toUpperCase()
        .includes("NO AFECTADO");

    resultado.innerHTML = `
    <div class="ficha">

        <div class="campo"><b>Día:</b> ${dato.dia}</div>

        <div class="campo"><b>Tren:</b> ${dato.tren}</div>

        <div class="campo"><b>Origen:</b> ${dato.origen}</div>

        <div class="campo"><b>Destino:</b> ${dato.destino}</div>

        <div class="campo"><b>Hora salida:</b> ${dato.salida}</div>

        <div class="campo"><b>Hora llegada:</b> ${dato.llegada}</div>

        <div class="estado ${circula ? 'verde':'rojo'}">
            ${circula ? '🟢 CIRCULA' : '🔴 NO CIRCULA'}
        </div>

        ${
            dato.observaciones.trim() !== ""
            ? `
            <div class="obs">
                <b>Observaciones</b><br><br>
                ${dato.observaciones}
            </div>
            `
            : ""
        }

    </div>`;
}

</script>

</body>
</html>
