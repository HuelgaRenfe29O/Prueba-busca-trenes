<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renfe - Consulta de Trenes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#640554;
    padding:20px;
}

.cabecera{
    max-width:1200px;
    margin:0 auto 25px;
    background:linear-gradient(
        90deg,
        #7a0a60 0%,
        #9b0f67 25%,
        #c00060 55%,
        #e10068 80%,
        #ff4a93 100%
    );
    border-radius:20px;
    padding:20px 30px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.cabecera-contenido{
    display:flex;
    align-items:center;
    gap:20px;
}

.logo-renfe{
    width:90px;
    height:auto;
}

.titulo h1{
    color:white;
    font-size:56px;
    line-height:1;
}

.titulo h2{
    color:white;
    font-size:24px;
    font-weight:300;
    margin-top:5px;
}

.card{
    max-width:1200px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.buscador{
    background:linear-gradient(
        90deg,
        #7a0a60 0%,
        #9b0f67 25%,
        #c00060 55%,
        #e10068 80%,
        #ff4a93 100%
    );
    border-radius:15px;
    padding:25px;
    margin-bottom:25px;
}

.buscador h3{
    color:white;
    text-align:center;
    margin-bottom:15px;
    font-size:28px;
}

input,select{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.btn{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#c00060;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.ficha{
    background:#f8f8f8;
    padding:25px;
    border-radius:15px;
}

.campo{
    margin-bottom:10px;
    font-size:18px;
}

.estado{
    margin-top:20px;
    padding:20px;
    text-align:center;
    color:white;
    font-size:30px;
    font-weight:bold;
    border-radius:12px;
}

.verde{
    background:#16a34a;
}

.rojo{
    background:#dc2626;
}

.obs{
    margin-top:20px;
    background:white;
    border-left:5px solid #c00060;
    padding:15px;
    border-radius:8px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#c00060;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f5f5f5;
}

footer{
    text-align:center;
    color:white;
    margin-top:20px;
}

@media(max-width:768px){

    .logo-renfe{
        width:65px;
    }

    .titulo h1{
        font-size:38px;
    }

    .titulo h2{
        font-size:18px;
    }

    .card{
        padding:20px;
    }
}

</style>
</head>

<body>

<header class="cabecera">

    <div class="cabecera-contenido">

        <img
            src="galleta-renfe.png"
            alt="Renfe"
            class="logo-renfe">

        <div class="titulo">
            <h1>RENFE</h1>
            <h2>Consulta de circulación de trenes</h2>
        </div>

    </div>

</header>

<div class="card">

    <div class="buscador">

        <h3>Consulta por número de tren</h3>

        <input
            type="text"
            id="tren"
            placeholder="Introduzca número de tren">

    </div>

    <div id="resultado"></div>

    <hr style="margin:40px 0">

    <div class="buscador">

        <h3>Búsqueda entre estaciones</h3>

        <div class="grid">

            <select id="origenFiltro">
                <option value="">Todos los orígenes</option>
            </select>

            <select id="destinoFiltro">
                <option value="">Todos los destinos</option>
            </select>

            <select id="estadoFiltro">
                <option value="">Todos</option>
                <option value="circula">Solo circulan</option>
                <option value="nocircula">Solo no circulan</option>
            </select>

        </div>

        <button class="btn" onclick="buscarRecorridos()">
            Buscar
        </button>

    </div>

    <div id="tablaResultados"></div>

</div>

<footer>
Renfe · Consulta de afectaciones
</footer>

<script>

let trenes = [];

fetch("datos.csv")
.then(r => r.text())
.then(texto => {

    const lineas = texto.split(/\r?\n/);

    for(let i=1;i<lineas.length;i++){

        if(!lineas[i].trim()) continue;

        const c = lineas[i].split(";");

        trenes.push({
            dia:c[0]||"",
            tren:c[1]||"",
            salida:c[2]||"",
            llegada:c[3]||"",
            recorrido:c[4]||"",
            origen:c[5]||"",
            destino:c[6]||"",
            afectacion:c[7]||"",
            observaciones:c[8]||""
        });
    }

    cargarFiltros();
});

function cargarFiltros(){

    const origenes=[...new Set(trenes.map(t=>t.origen).filter(Boolean))].sort();
    const destinos=[...new Set(trenes.map(t=>t.destino).filter(Boolean))].sort();

    origenes.forEach(o=>{
        origenFiltro.innerHTML += `<option value="${o}">${o}</option>`;
    });

    destinos.forEach(d=>{
        destinoFiltro.innerHTML += `<option value="${d}">${d}</option>`;
    });
}

document.getElementById("tren").addEventListener("input",buscar);

function buscar(){

    const numero=document.getElementById("tren").value.trim();

    if(numero===""){
        resultado.innerHTML="";
        return;
    }

    const dato=trenes.find(t=>t.tren.trim()===numero);

    if(!dato){
        resultado.innerHTML="<div class='ficha'>Tren no encontrado</div>";
        return;
    }

    const circula =
        dato.afectacion.trim().toUpperCase()==="NO AFECTADO";

    resultado.innerHTML=`

    <div class="ficha">

        <div class="campo"><b>Día:</b> ${dato.dia}</div>
        <div class="campo"><b>Tren:</b> ${dato.tren}</div>
        <div class="campo"><b>Origen:</b> ${dato.origen}</div>
        <div class="campo"><b>Destino:</b> ${dato.destino}</div>
        <div class="campo"><b>Hora salida:</b> ${dato.salida}</div>
        <div class="campo"><b>Hora llegada:</b> ${dato.llegada}</div>

        <div class="estado ${circula ? 'verde':'rojo'}">
            ${circula ? '🟢 CIRCULA' : '🔴 NO CIRCULA'}
        </div>

        ${
            circula &&
            dato.observaciones.trim() !== ""
            ?
            `<div class="obs">
                <b>Observaciones</b><br><br>
                ${dato.observaciones}
              </div>`
            : ""
        }

    </div>`;
}

function buscarRecorridos(){

    let resultados=[...trenes];

    const origen=origenFiltro.value;
    const destino=destinoFiltro.value;
    const estado=estadoFiltro.value;

    if(origen){
        resultados=resultados.filter(t=>t.origen===origen);
    }

    if(destino){
        resultados=resultados.filter(t=>t.destino===destino);
    }

    if(estado==="circula"){
        resultados=resultados.filter(
            t=>t.afectacion.trim().toUpperCase()==="NO AFECTADO"
        );
    }

    if(estado==="nocircula"){
        resultados=resultados.filter(
            t=>t.afectacion.trim().toUpperCase()!=="NO AFECTADO"
        );
    }

    let html=`
    <div class="ficha">

    <h3>${resultados.length} tren(es) encontrados</h3>

    <br>

    <table>

        <thead>
            <tr>
                <th>Tren</th>
                <th>Salida</th>
                <th>Llegada</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Estado</th>
            </tr>
        </thead>

        <tbody>
    `;

    resultados.forEach(t=>{

        const circula =
            t.afectacion.trim().toUpperCase()==="NO AFECTADO";

        html += `
        <tr>
            <td>${t.tren}</td>
            <td>${t.salida}</td>
            <td>${t.llegada}</td>
            <td>${t.origen}</td>
            <td>${t.destino}</td>
            <td>${circula ? '🟢 CIRCULA' : '🔴 NO CIRCULA'}</td>
        </tr>
        `;
    });

    html += `
        </tbody>
    </table>

    </div>`;

    tablaResultados.innerHTML = html;
}

</script>

</body>
</html>
