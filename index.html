<!DOCTYPE html>
<html lang="es">
<head>

<title>Consulta circulación de trenes afectados por la huelga</title>

<style>

*{

body{

}

}

.btn{

    background:#c00060;

}

tr:hover{
    background:#f2f2f2;
}

.estado{
    margin-top:15px;
    padding:18px;
    border-radius:12px;
    color:white;
    text-align:center;
    font-size:30px;
    font-weight:bold;
}

.verde{
    background:#16a34a;
}

.rojo{
    background:#dc2626;
}

.obs{
    margin-top:15px;
    background:white;
    border-left:5px solid #c00060;

}

footer{
    text-align:center;

    body{
        padding:6px;
    }

    .cabecera{

    .card{
        width:100%;
        max-width:none;

    .logo-renfe{
        width:55px;
    }

    .titulo h1{
        font-size:30px;
    }

    .titulo h2{

    }

        font-size:18px;

    input,

    .btn{
        font-size:14px;

        font-size:11px;
    }

    th,
    td{
        padding:4px;
    }

    .estado{
        font-size:22px;
        padding:12px;
    }

    }

}

</style>
</head>

<body>

<header class="cabecera">

    <div class="cabecera-contenido">

        <img
            src="galleta-renfe.png"
            alt="Renfe"
            class="logo-renfe">

        <div class="titulo">
            <h1>RENFE</h1>
            <h2>Consulta circulación de trenes afectados por la huelga</h2>
        </div>

    </div>

</header>

<div class="card">

    <div class="buscador">
        <h3>Consulta por número de tren</h3>
        <input
            type="text"
            id="tren"
            placeholder="Introduzca número de tren">
    </div>

    <div id="resultado"></div>

    <hr class="separador">

    <div class="buscador">

        <h3>Consulta por estación de origen</h3>

        <div class="grid">

            <select id="origenFiltro">
                <option value="">Seleccione origen</option>
            </select>

            <select id="estadoFiltro">
                <option value="">Todos</option>
                <option value="circula">Solo circulan</option>
                <option value="nocircula">Solo no circulan</option>
            </select>

        </div>

        <button class="btn" onclick="buscarOrigen()">
            Buscar
        </button>

    </div>

    <div id="tablaResultados"></div>

</div>

<footer>
Renfe · Información al viajero
</footer>

<script>

let trenes = [];

fetch("datos.csv")
.then(r => r.text())
.then(texto => {

    const lineas = texto.split(/\r?\n/);

    for(let i=1;i<lineas.length;i++){

        if(!lineas[i].trim()) continue;

        const c = lineas[i].split(";");

        trenes.push({
            dia: c[0] || "",
            tren: c[1] || "",
            salida: c[2] || "",
            llegada: c[3] || "",
            recorrido: c[4] || "",
            origen: c[5] || "",
            destino: c[6] || "",
            afectacion: c[7] || "",
            observaciones: c[8] || ""
        });

    }

    cargarOrigenes();

});

function cargarOrigenes(){

    const origenes = [
        ...new Set(
            trenes
            .map(t => t.origen)
            .filter(Boolean)
        )
    ].sort();

    const select =
    document.getElementById("origenFiltro");

    origenes.forEach(o => {

        select.innerHTML +=
        `<option value="${o}">${o}</option>`;

    });

}

function ordenar(lista){

    lista.sort((a,b)=>{

        const fechaA =
        new Date(a.dia.split("/").reverse().join("-"));

        const fechaB =
        new Date(b.dia.split("/").reverse().join("-"));

        if(fechaA.getTime() !== fechaB.getTime()){
            return fechaA - fechaB;
        }

        const hA = (a.salida || "0:00").split(":");
        const hB = (b.salida || "0:00").split(":");

        const minA =
            parseInt(hA[0],10) * 60 +
            parseInt(hA[1],10);

        const minB =
            parseInt(hB[0],10) * 60 +
            parseInt(hB[1],10);

        return minA - minB;

    });

}

document
.getElementById("tren")
.addEventListener("input",buscarTren);

function buscarTren(){

    const numero =
    document.getElementById("tren").value.trim();

    const resultado =
    document.getElementById("resultado");

    if(numero === ""){
        resultado.innerHTML = "";
        return;
    }

    const datos =
    trenes.filter(
        t => t.tren.trim() === numero
    );

    if(datos.length === 0){

        resultado.innerHTML =
        "<div class='ficha'>Tren no encontrado</div>";

        return;
    }

    ordenar(datos);

    let html = "";

    datos.forEach(dato => {

        const circula =
        dato.afectacion
            .trim()
            .toUpperCase()
            .includes("NO AFECTADO");

        html += `

        <div class="ficha">

            <table>

                <thead>

                    <tr>
                        <th>Día</th>
                        <th>Tren</th>
                        <th>Salida</th>
                        <th>Origen</th>
                        <th>Llegada</th>
                        <th>Destino</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>${dato.dia}</td>
                        <td>${dato.tren}</td>
                        <td>${dato.salida}</td>
                        <td>${dato.origen}</td>
                        <td>${dato.llegada}</td>
                        <td>${dato.destino}</td>
                    </tr>

                </tbody>

            </table>

            <div class="estado ${circula ? 'verde' : 'rojo'}">
                ${circula ? '🟢 CIRCULA' : '🔴 NO CIRCULA'}
            </div>

            ${
                circula &&
                dato.observaciones &&
                dato.observaciones.trim() !== ""
                ?
                `<div class="obs">
                    <b>Observaciones</b><br><br>
                    ${dato.observaciones}
                </div>`
                : ""
            }

        </div>
        `;
    });

    resultado.innerHTML = html;

}

function buscarOrigen(){

    let resultados = [...trenes];

    const origen =
    document.getElementById("origenFiltro").value;

    const estado =
    document.getElementById("estadoFiltro").value;

    if(origen){

        resultados = resultados.filter(
            t => t.origen === origen
        );

    }

    if(estado === "circula"){

        resultados = resultados.filter(
            t => t.afectacion
                    .toUpperCase()
                    .includes("NO AFECTADO")
        );

    }

    if(estado === "nocircula"){

        resultados = resultados.filter(
            t => !t.afectacion
                    .toUpperCase()
                    .includes("NO AFECTADO")
