<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta circulación de trenes afectados por la huelga</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#640554;
    padding:20px;
}

.cabecera{
    max-width:1200px;
    margin:0 auto 25px auto;
    background:linear-gradient(
        90deg,
        #7a0a60 0%,
        #9b0f67 25%,
        #c00060 55%,
        #e10068 80%,
        #ff4a93 100%
    );
    border-radius:20px;
    padding:20px 30px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.cabecera-contenido{
    display:flex;
    align-items:center;
    gap:20px;
}

.logo-renfe{
    width:90px;
    height:auto;
    flex-shrink:0;
}

.titulo h1{
    color:white;
    font-size:56px;
    line-height:1;
}

.titulo h2{
    color:white;
    font-size:22px;
    font-weight:300;
    margin-top:6px;
    line-height:1.2;
}

.card{
    max-width:1200px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.20);
}

.buscador{
    background:linear-gradient(
        90deg,
        #7a0a60 0%,
        #9b0f67 25%,
        #c00060 55%,
        #e10068 80%,
        #ff4a93 100%
    );
    border-radius:15px;
    padding:25px;
    margin-bottom:25px;
}

.buscador h3{
    color:white;
    text-align:center;
    margin-bottom:15px;
    font-size:28px;
}

input,select{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#c00060;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

.ficha{
    background:#f8f8f8;
    padding:25px;
    border-radius:15px;
}

.estado{
    margin-top:20px;
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:white;
    padding:18px;
    border-radius:12px;
}

.verde{
    background:#16a34a;
}

.rojo{
    background:#dc2626;
}

.obs{
    margin-top:20px;
    background:white;
    border-left:5px solid #c00060;
    padding:15px;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background:#c00060;
    color:white;
    padding:12px;
    text-align:center;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#f3f3f3;
}

footer{
    text-align:center;
    color:white;
    margin-top:20px;
    font-size:13px;
}

.separador{
    margin:35px 0;
}

@media(max-width:768px){

    .logo-renfe{
        width:65px;
    }

    .titulo h1{
        font-size:38px;
    }

    .titulo h2{
        font-size:16px;
    }

    .card{
        padding:20px;
    }

    th,td{
        font-size:12px;
        padding:6px;
    }

    .estado{
        font-size:28px;
    }
}

</style>
</head>

<body>

<header class="cabecera">

    <div class="cabecera-contenido">

        <img
            src="galleta-renfe.png"
            alt="Renfe"
            class="logo-renfe">

        <div class="titulo">
            <h1>RENFE</h1>
            <h2>Consulta circulación de trenes afectados por la huelga</h2>
        </div>

    </div>

</header>

<div class="card">

    <!-- BUSQUEDA POR TREN -->

    <div class="buscador">

        <h3>Consulta por número de tren</h3>

        <input
            type="text"
            id="tren"
            placeholder="Introduzca número de tren">

    </div>

    <div id="resultado"></div>

    <hr class="separador">

    <!-- BUSQUEDA POR ORIGEN -->

    <div class="buscador">

        <h3>Consulta por estación de origen</h3>

        <div class="grid">

            <select id="origenFiltro">
                <option value="">Seleccione origen</option>
            </select>

            <select id="estadoFiltro">
                <option value="">Todos</option>
                <option value="circula">Solo circulan</option>
                <option value="nocircula">Solo no circulan</option>
            </select>

        </div>

        <button class="btn" onclick="buscarOrigen()">
            Buscar
        </button>

    </div>

    <div id="tablaResultados"></div>

</div>

<footer>
Renfe · Información al viajero
</footer>

<script>

let trenes=[];

fetch("datos.csv")
.then(r=>r.text())
.then(texto=>{

    const lineas=texto.split(/\r?\n/);

    for(let i=1;i<lineas.length;i++){

        if(!lineas[i].trim()) continue;

        const c=lineas[i].split(";");

        trenes.push({

            dia:c[0] || "",
            tren:c[1] || "",
            salida:c[2] || "",
            llegada:c[3] || "",
            recorrido:c[4] || "",
            origen:c[5] || "",
            destino:c[6] || "",
            afectacion:c[7] || "",
            observaciones:c[8] || ""

        });

    }

    cargarOrigenes();

});

function cargarOrigenes(){

    const origenes=[
        ...new Set(
            trenes
            .map(t=>t.origen)
            .filter(v=>v)
        )
    ].sort();

    const select=
        document.getElementById("origenFiltro");

    origenes.forEach(o=>{

        select.innerHTML +=
        `<option value="${o}">${o}</option>`;

    });

}

document.getElementById("tren")
.addEventListener("input",buscarTren);

function buscarTren(){

    const numero=
        document.getElementById("tren")
        .value
        .trim();

    const resultado=
        document.getElementById("resultado");

    if(numero===""){

        resultado.innerHTML="";
        return;

    }

    const dato=
        trenes.find(
            t => t.tren.trim() === numero
        );

    if(!dato){

        resultado.innerHTML=
        "<div class='ficha'>Tren no encontrado.</div>";

        return;
    }

    const circula=
        dato.afectacion
        .trim()
        .toUpperCase()==="NO AFECTADO";

    resultado.innerHTML=`

    <div class="ficha">

        <table>

            <thead>
                <tr>
                    <th>Día</th>
                    <th>Tren</th>
                    <th>Salida</th>
                    <th>Origen</th>
                    <th>Llegada</th>
                    <th>Destino</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>${dato.dia}</td>
                    <td>${dato.tren}</td>
                    <td>${dato.salida}</td>
                    <td>${dato.origen}</td>
                    <td>${dato.llegada}</td>
                    <td>${dato.destino}</td>
                </tr>
            </tbody>

        </table>

        <div class="estado ${circula ? 'verde' : 'rojo'}">
            ${circula ? '🟢 CIRCULA' : '🔴 NO CIRCULA'}
        </div>

        ${
            circula &&
            dato.observaciones.trim() !== ""
            ?
            `
            <div class="obs">
                <b>Observaciones</b><br><br>
                ${dato.observaciones}
            </div>
            `
            : ""
        }

    </div>

    `;

}

function buscarOrigen(){

    const origen=
        document.getElementById("origenFiltro").value;

    const estado=
        document.getElementById("estadoFiltro").value;

    let resultados=[...trenes];

    if(origen){

        resultados=resultados.filter(
            t => t.origen === origen
        );

    }

    if(estado==="circula"){

        resultados=resultados.filter(
            t =>
            t.afectacion.trim().toUpperCase()
            === "NO AFECTADO"
        );

    }

    if(estado==="nocircula"){

        resultados=resultados.filter(
            t =>
            t.afectacion.trim().toUpperCase()
            !== "NO AFECTADO"
        );

    }

    let html=`

    <div class="ficha">

        <h3>
            ${resultados.length}
            tren(es) encontrados
        </h3>

        <table>

            <thead>

                <tr>
                    <th>Día</th>
                    <th>Tren</th>
                    <th>Salida</th>
                    <th>Origen</th>
                    <th>Llegada</th>
                    <th>Destino</th>
                    <th>Estado</th>
                </tr>

            </thead>

            <tbody>

    `;

    resultados.forEach(t=>{

        const circula=
            t.afectacion.trim().toUpperCase()
            === "NO AFECTADO";

        html+=`

        <tr>

            <td>${t.dia}</td>
            <td>${t.tren}</td>
            <td>${t.salida}</td>
            <td>${t.origen}</td>
            <td>${t.llegada}</td>
            <td>${t.destino}</td>

            <td>
                ${circula
                ? '🟢 CIRCULA'
                : '🔴 NO CIRCULA'}
            </td>

        </tr>

        `;
    });

    html+=`

            </tbody>

        </table>

    </div>

    `;

    document.getElementById("tablaResultados")
    .innerHTML=html;

}

</script>

</body>
</html>
